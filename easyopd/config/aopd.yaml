# EasyOPD aopd config (same-tokenizer OPD, easyopd/opd/).
# Enable in verl with +actor_rollout_ref.actor.opd.method=aopd; method keys go
# under +actor_rollout_ref.actor.opd.<key>. See easyopd/docs/methods/aopd.md.
easyopd:
  method:
    name: aopd

data:
  dataset: BytedTsinghua-SIA/DAPO-Math-17k
  dataset_split: train
  prompt_template: math_qa
  prompt_key: prompt
