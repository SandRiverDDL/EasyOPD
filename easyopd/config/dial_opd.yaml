# EasyOPD dial_opd config (same-tokenizer OPD, easyopd/opd/).
# Enable in verl with +actor_rollout_ref.actor.opd.method=dial_opd; method keys go
# under +actor_rollout_ref.actor.opd.<key>. See easyopd/docs/methods/dial_opd.md.
easyopd:
  method:
    name: dial_opd

data:
  dataset: BytedTsinghua-SIA/DAPO-Math-17k
  dataset_split: train
  prompt_template: math_qa
  prompt_key: prompt
