# EasyOPD v_opd config (same-tokenizer OPD, easyopd/opd/).
# Enable in verl with +actor_rollout_ref.actor.opd.method=v_opd; method keys go
# under +actor_rollout_ref.actor.opd.<key>. See easyopd/docs/methods/v_opd.md.
easyopd:
  method:
    name: v_opd

data:
  dataset: BytedTsinghua-SIA/DAPO-Math-17k
  dataset_split: train
  prompt_template: math_qa
  prompt_key: prompt
