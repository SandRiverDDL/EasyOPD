# 影响 run 可比性的配置变更，只追加，不改旧条目。
#
# scripts/run_table.py 对每个 run 逐条检查：field 的取值不在 expect 里，就在 RUNS.md 标「过时(<id>)」。
#   scope: train  训练本身不同，结果不能和当前 run 放一张表比
#   scope: val    只影响训练时验证曲线；训练可比，离线评测可以重测
# field 可选值见 run_table.py 的 run_fields()：lr / dtype / eos_ok / val。
# 新增一条变更时：在这里追加，并在 commit / 文档里说明从哪个 run 起生效。

